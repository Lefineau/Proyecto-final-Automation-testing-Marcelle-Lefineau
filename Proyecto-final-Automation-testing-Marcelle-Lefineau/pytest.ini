[pytest]

testpaths = tests

python_files = test_*.py

python_classes = Test*

python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --html=reports/reporte.html
    --self-contained-html

markers =
    ui: pruebas de interfaz web
    api: pruebas de servicios API
    smoke: pruebas principales del sistema